<!DOCTYPE html>

      body { margin: 0; overflow: hidden; }
      #bg-canvas {
          position: fixed;
          top: 0;
          left: 0;

  <div class="space-y-3 mb-8">

    <a href="mailto:daniel.beraanek@gmail.com"
       class="group flex items-center justify-between p-3 px-4 rounded-xl bg-slate-700/40 border border-slate-600 hover:border-indigo-500/50 hover:bg-slate-700 transition-all duration-300">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <span class="text-sm font-medium text-slate-300 group-hover:text-white">daniel.beraanek@gmail.com</span>
      </div>
    </a>

    <a href="mailto:daniel.beranek@fsv.cvut.cz"
       class="group flex items-center justify-between p-3 px-4 rounded-xl bg-slate-700/40 border border-slate-600 hover:border-indigo-500/50 hover:bg-slate-700 transition-all duration-300">

<footer class="relative z-10 mt-8 text-slate-500 text-xs">
  &copy; 2026 Daniel Beránek
</footer>

<script>
  const container = document.getElementById('bg-canvas');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0f172a, 0.002);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.BufferGeometry();
  const count = 2000;
  const positions = new Float32Array(count * 3);

  for(let i = 0; i < count * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 10;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    size: 0.015,
    color: 0x818cf8,
    transparent: true,
    opacity: 0.8,
  });

  const particlesMesh = new THREE.Points(geometry, material);
  scene.add(particlesMesh);

  camera.position.z = 3;

  let mouseX = 0;
  let mouseY = 0;
  document.addEventListener('mousemove', (event) => {
    mouseX = event.clientX / window.innerWidth - 0.5;
    mouseY = event.clientY / window.innerHeight - 0.5;
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();
    particlesMesh.rotation.y = elapsedTime * 0.05;
    particlesMesh.rotation.x = elapsedTime * 0.02;
    particlesMesh.rotation.y += mouseX * 0.05;
    particlesMesh.rotation.x += mouseY * 0.05;
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
